<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, noarchive">
<title>Untitled</title>
<style>

:root { --poem-font: Georgia, 'Times New Roman', serif; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper, #fdfdfb); color: #1a1a1a;
       font-family: var(--poem-font); line-height: 1.6; }
.poem-wrap { max-width: 42rem; margin: 0 auto; padding: 3rem 1.25rem 6rem; }
h1.poem-title { font-size: 1.5rem; font-weight: normal;
                letter-spacing: .02em; margin: 0 0 2.5rem; }
.poem { white-space: pre-wrap; font-size: 1.05rem; }
.poem em { font-style: italic; }
@media (max-width: 480px) { .poem { font-size: 1rem; } }

.poem-wrap { padding-right: 2.5rem; }
h1.poem-title { margin-bottom: .6rem; }
p.poem-subtitle { font-style: italic; color: #4a4741; margin: 0 0 2.5rem;
                  font-size: 1rem; }
h1.poem-title + .poem { margin-top: 2.5rem; }
figure.poem-image { margin: 0 0 2.5rem; }
figure.poem-image img { display: block; max-width: 100%; height: auto; }
.poem .r { float: right; clear: right; text-align: right; }
.poem .rl { display: block; text-align: right; }
.poem::after { content: ""; display: block; clear: both; }
.poem:empty { min-height: 45vh; }
.credit { margin-top: 4rem; border-top: 1px solid #d8d4cc; padding-top: 1rem;
          font-size: .9rem; color: #6b675f; }
.credit em { font-style: italic; }

</style>
</head>
<body class="">
<main class="poem-wrap">
<h1 class="poem-title">Untitled</h1>
<p class="poem-subtitle">(or, I suppose when you mention it like that, we could have made different decisions)</p>
<div class="poem"></div>
<p class="credit">First published in <em>Better Than Starbucks</em>, Vol. V No. IV, July 2020</p>
</main>
<script>

</script>
</body>
</html>
